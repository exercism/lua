name: Test

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        lua: [5.3, 5.4, 5.5]
    name: Test (Lua ${{ matrix.lua }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce

      - name: build
        run: |
          luarocks install busted

      - name: test
        run: |
          bin/test-all

  tests:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every Lua version passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one Lua version."
            exit 1
          fi
